<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tameion · Livro de pagamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #EEF2EA;
    --paper-line: #C9D3C3;
    --ink: #1E2A22;
    --ink-soft: #4B5A4F;
    --gold: #9C6B1F;
    --gold-bg: #F1E6D2;
    --rust: #8B3A2B;
    --rust-bg: #F3E2DD;
    --slate: #52514C;
    --slate-bg: #E7E5E0;
    --focus: #2C5AA0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    line-height: 1.5;
  }

  a { color: var(--gold); }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .page {
    max-width: 920px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
  }

  header.top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem 1.5rem;
    border-bottom: 1px solid var(--paper-line);
    padding-bottom: 1.25rem;
    margin-bottom: 2rem;
  }

  h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.75rem;
    margin: 0;
  }

  .stat-line {
    font-size: 0.9rem;
    color: var(--ink-soft);
  }
  .stat-line strong { color: var(--ink); font-weight: 600; }

  section { margin-bottom: 2.75rem; }

  h2 {
    font-family: 'Source Serif 4', serif;
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0 0 0.9rem;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .reviewer-field {
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .reviewer-field input {
    font-family: inherit;
    font-size: 0.9rem;
    border: none;
    border-bottom: 1px solid var(--paper-line);
    background: transparent;
    color: var(--ink);
    padding: 0.15rem 0.2rem;
    width: 9rem;
  }
  .reviewer-field input:focus { border-color: var(--ink); }

  .empty {
    color: var(--ink-soft);
    font-size: 0.92rem;
    padding: 0.75rem 0;
    border-top: 1px solid var(--paper-line);
  }

  .pending-row {
    border-top: 1px solid var(--paper-line);
    padding: 1rem 0;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.5rem 1.5rem;
    align-items: start;
    transition: background-color 0.4s ease;
  }
  .pending-row.flash { background-color: var(--gold-bg); }

  .pending-main { min-width: 0; }
  .pending-title {
    font-weight: 600;
    margin: 0 0 0.2rem;
  }
  .pending-meta {
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin: 0 0 0.4rem;
  }
  .pending-reason {
    font-size: 0.88rem;
    color: var(--rust);
    margin: 0 0 0.4rem;
  }
  .score-row {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .amount {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.05rem;
    font-weight: 500;
    white-space: nowrap;
  }

  .actions {
    display: flex;
    gap: 0.5rem;
    align-self: center;
  }

  button {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    padding: 0.45rem 0.9rem;
    border-radius: 3px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  button.approve { background: var(--gold); color: #fff; }
  button.approve:hover { background: #875D1A; }
  button.deny { background: transparent; color: var(--rust); border-color: var(--rust); }
  button.deny:hover { background: var(--rust-bg); }
  button.primary { background: var(--ink); color: var(--paper); }
  button.primary:hover { background: #324539; }
  button:disabled { opacity: 0.5; cursor: default; }

  form.new-request {
    border-top: 1px solid var(--paper-line);
    padding-top: 1rem;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.9rem 1.25rem;
  }
  form.new-request .full { grid-column: 1 / -1; }
  label { display: block; font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 0.25rem; }
  input, select, textarea {
    width: 100%;
    font-family: inherit;
    font-size: 0.92rem;
    padding: 0.5rem 0.6rem;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
  }
  textarea { resize: vertical; min-height: 3.5rem; }
  .form-actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 0.9rem; }
  .form-result { font-size: 0.88rem; color: var(--ink-soft); }

  .ledger-wrap { overflow-x: auto; border-top: 1px solid var(--paper-line); }
  table.ledger { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  table.ledger th {
    text-align: left;
    font-weight: 500;
    color: var(--ink-soft);
    padding: 0.5rem 0.6rem;
    border-bottom: 1px solid var(--paper-line);
    white-space: nowrap;
  }
  table.ledger td {
    padding: 0.55rem 0.6rem;
    border-bottom: 1px solid var(--paper-line);
    vertical-align: top;
  }
  table.ledger td.num { font-family: 'IBM Plex Mono', monospace; white-space: nowrap; }
  table.ledger tr.flash td { background-color: var(--gold-bg); transition: background-color 0.4s ease; }

  .badge {
    display: inline-block;
    font-size: 0.76rem;
    font-weight: 500;
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
    white-space: nowrap;
  }
  .badge.approve { background: var(--gold-bg); color: var(--gold); }
  .badge.approve_reduced { background: var(--gold-bg); color: var(--gold); }
  .badge.escalate { background: var(--rust-bg); color: var(--rust); }
  .badge.escalate.denied { background: var(--slate-bg); color: var(--slate); }

  .pay-failed { color: var(--rust); font-weight: 600; cursor: help; }
  .pay-skipped { color: var(--slate); cursor: help; }
  .tx-link { font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; }

  @media (prefers-reduced-motion: reduce) {
    .pending-row, table.ledger tr { transition: none; }
  }

  @media (max-width: 640px) {
    form.new-request { grid-template-columns: 1fr; }
    .pending-row { grid-template-columns: 1fr; }
    .actions { justify-content: flex-start; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <h1>Livro de pagamentos</h1>
    <div style="display:flex; align-items:baseline; gap:1.25rem;">
      <div class="stat-line" id="statLine">Carregando…</div>
      <a href="/settings" style="font-size:0.85rem; color:var(--ink-soft); text-decoration:none;">Regras &rarr;</a>
    </div>
  </header>

  <section>
    <div class="section-head">
      <h2>Precisa da sua decisão</h2>
      <div class="reviewer-field">
        Revisado por
        <input id="reviewerName" type="text" placeholder="seu nome" value="operador" />
      </div>
    </div>
    <div id="pendingList"></div>
  </section>

  <section>
    <h2>Nova solicitação</h2>
    <form class="new-request" id="newRequestForm">
      <div>
        <label for="f-category">Categoria</label>
        <select id="f-category" required>
          <option value="contractor_milestone">Contractor milestone</option>
          <option value="supply_purchase">Compra de insumo</option>
          <option value="operational_expense">Despesa operacional</option>
          <option value="other">Outro</option>
        </select>
      </div>
      <div>
        <label for="f-amount">Valor (USDC)</label>
        <input id="f-amount" type="number" step="0.01" min="0.01" required />
      </div>
      <div>
        <label for="f-requester">Solicitante</label>
        <input id="f-requester" type="text" required />
      </div>
      <div>
        <label for="f-wallet">Carteira de destino (opcional)</label>
        <input id="f-wallet" type="text" placeholder="0x…" />
      </div>
      <div class="full">
        <label for="f-description">Descrição</label>
        <textarea id="f-description" required></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="primary">Enviar solicitação</button>
        <span class="form-result" id="formResult"></span>
      </div>
    </form>
  </section>

  <section>
    <h2>Histórico</h2>
    <div class="ledger-wrap">
      <table class="ledger">
        <thead>
          <tr>
            <th>Quando</th>
            <th>Solicitação</th>
            <th>Categoria</th>
            <th>Valor</th>
            <th>Decisão</th>
            <th>Pago</th>
            <th>Transação</th>
          </tr>
        </thead>
        <tbody id="ledgerBody"></tbody>
      </table>
    </div>
  </section>

</div>

<script>
const API = '';
const CATEGORY_LABEL = {
  contractor_milestone: 'Contractor milestone',
  supply_purchase: 'Compra de insumo',
  operational_expense: 'Despesa operacional',
  other: 'Outro',
};
const EXPLORER_TX_URL = 'https://explorer.testnet.arc.io/tx/';

function fmtAmount(v) {
  return new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v) + ' USDC';
}
function fmtWhen(iso) {
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function fetchJSON(url, options) {
  const res = await fetch(API + url, options);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `Request failed (${res.status})`);
  }
  return res.json();
}

function renderStats(stats) {
  document.getElementById('statLine').innerHTML =
    `<strong>${stats.pending_count}</strong> pendente${stats.pending_count === 1 ? '' : 's'} · ` +
    `<strong>${fmtAmount(stats.paid_total_usdc)}</strong> pago · ` +
    `${stats.total_requests} solicitaç${stats.total_requests === 1 ? 'ão' : 'ões'} no total` +
    (stats.payments_failed ? ` · <strong class="pay-failed">${stats.payments_failed} pagamento${stats.payments_failed === 1 ? '' : 's'} com falha</strong>` : '');
}

function renderPending(items) {
  const el = document.getElementById('pendingList');
  if (items.length === 0) {
    el.innerHTML = '<p class="empty">Nenhuma solicitação pendente — tudo em dia.</p>';
    return;
  }
  el.innerHTML = items.map(e => {
    const r = e.request;
    const s = e.scores;
    return `
      <div class="pending-row" data-id="${escapeHtml(r.request_id)}">
        <div class="pending-main">
          <p class="pending-title">${escapeHtml(r.requester)} · ${CATEGORY_LABEL[r.category] || r.category}</p>
          <p class="pending-meta">${escapeHtml(r.description)}</p>
          <p class="pending-reason">${escapeHtml(e.reason)}</p>
          <p class="score-row">confiança ${s.trust.value.toFixed(2)} · urgência ${s.urgency.value.toFixed(2)} · importância ${s.importance.value.toFixed(2)}</p>
        </div>
        <div>
          <p class="amount" style="text-align:right">${fmtAmount(r.amount_usdc)}</p>
          <div class="actions">
            <button class="deny" data-action="deny" data-id="${escapeHtml(r.request_id)}">Negar</button>
            <button class="approve" data-action="approve" data-id="${escapeHtml(r.request_id)}">Aprovar</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

function decisionBadge(e) {
  if (e.decision === 'escalate' && e.human_review === 'denied') {
    return `<span class="badge escalate denied">Negado${e.reviewer ? ' · ' + escapeHtml(e.reviewer) : ''}</span>`;
  }
  if (e.decision === 'escalate') {
    return `<span class="badge escalate">Escalado</span>`;
  }
  if (e.decision === 'approve_reduced') {
    return `<span class="badge approve_reduced">Aprovado (reduzido)</span>`;
  }
  if (e.decision === 'approve') {
    const human = e.human_review === 'approved' ? ` · ${escapeHtml(e.reviewer || 'humano')}` : '';
    return `<span class="badge approve">Aprovado${human}</span>`;
  }
  return `<span class="badge">${escapeHtml(e.decision)}</span>`;
}

function paymentCell(e) {
  // payment_status is null on entries written before the field existed.
  const status = e.payment_status || (e.payment_executed ? 'executed' : 'not_applicable');
  const detail = escapeHtml(e.payment_detail || '');
  if (status === 'executed') return 'Sim';
  if (status === 'failed') return `<span class="pay-failed" title="${detail}">Falhou</span>`;
  if (status === 'skipped') return `<span class="pay-skipped" title="${detail}">Não enviado</span>`;
  return 'Não';
}

function renderLedger(entries) {
  const body = document.getElementById('ledgerBody');
  if (entries.length === 0) {
    body.innerHTML = '<tr><td colspan="7" class="empty">Nenhuma solicitação registrada ainda.</td></tr>';
    return;
  }
  body.innerHTML = entries.map(e => {
    const r = e.request;
    const amount = e.reduced_amount ?? r.amount_usdc;
    const tx = e.tx_hash
      ? `<a class="tx-link" href="${EXPLORER_TX_URL}${encodeURIComponent(e.tx_hash)}" target="_blank" rel="noopener">${escapeHtml(e.tx_hash.slice(0, 10))}…</a>`
      : '—';
    return `
      <tr data-id="${escapeHtml(r.request_id)}">
        <td>${fmtWhen(e.timestamp)}</td>
        <td>${escapeHtml(r.request_id)}</td>
        <td>${CATEGORY_LABEL[r.category] || r.category}</td>
        <td class="num">${fmtAmount(amount)}</td>
        <td>${decisionBadge(e)}</td>
        <td>${paymentCell(e)}</td>
        <td>${tx}</td>
      </tr>`;
  }).join('');
}

async function refresh() {
  const [stats, pending, ledger] = await Promise.all([
    fetchJSON('/api/stats'),
    fetchJSON('/api/escalations/pending'),
    fetchJSON('/api/requests/latest'),
  ]);
  renderStats(stats);
  renderPending(pending);
  renderLedger(ledger);
}

document.getElementById('pendingList').addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button[data-action]');
  if (!btn) return;
  const requestId = btn.dataset.id;
  const action = btn.dataset.action;
  const reviewer = document.getElementById('reviewerName').value.trim() || 'operador';

  const row = btn.closest('.pending-row');
  row.querySelectorAll('button').forEach(b => b.disabled = true);

  try {
    await fetchJSON(`/api/escalations/${encodeURIComponent(requestId)}/decision`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, reviewer }),
    });
    await refresh();
    const ledgerRow = document.querySelector(`#ledgerBody tr[data-id="${CSS.escape(requestId)}"]`);
    if (ledgerRow) {
      ledgerRow.classList.add('flash');
      setTimeout(() => ledgerRow.classList.remove('flash'), 1200);
    }
  } catch (err) {
    alert('Não foi possível registrar a decisão: ' + err.message);
    row.querySelectorAll('button').forEach(b => b.disabled = false);
  }
});

document.getElementById('newRequestForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const resultEl = document.getElementById('formResult');
  const submitBtn = ev.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  resultEl.textContent = 'Processando…';

  const payload = {
    request_id: 'ui-' + Date.now(),
    category: document.getElementById('f-category').value,
    amount_usdc: parseFloat(document.getElementById('f-amount').value),
    requester: document.getElementById('f-requester').value,
    description: document.getElementById('f-description').value,
    counterparty_wallet: document.getElementById('f-wallet').value.trim() || null,
  };

  try {
    const entry = await fetchJSON('/api/requests', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    resultEl.textContent = `Decisão: ${entry.decision} — ${entry.reason}`;
    ev.target.reset();
    await refresh();
  } catch (err) {
    resultEl.textContent = 'Erro: ' + err.message;
  } finally {
    submitBtn.disabled = false;
  }
});

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
